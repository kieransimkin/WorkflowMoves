<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc"><title id="title">Duplicate-send gate receipt flow</title><desc id="desc">An approved packet acquires a venue mutex and original-request claim. A verified email or form receipt releases only the owned mutex; uncertain outcomes retain it. The permanent claim remains.</desc><rect width="1000" height="270" rx="16" fill="#111827"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="30" y="36" font-size="23">One original request, one owned claim</text><g fill="#1e293b" stroke="#38bdf8" stroke-width="2"><rect x="30" y="65" width="220" height="100" rx="10"/><rect x="310" y="65" width="300" height="100" rx="10"/><rect x="670" y="65" width="300" height="100" rx="10"/></g><g font-size="18"><text x="50" y="101">Approved exact packet</text><text x="50" y="133">Fresh duplicate checks</text><text x="330" y="101">Owned venue mutex</text><text x="330" y="133">Permanent request claim</text><text x="690" y="101">Email ID or form evidence</text><text x="690" y="133">Verified terminal receipt</text></g><g stroke="#38bdf8" stroke-width="3"><path d="M250 115h60m-12-8 12 8-12 8M610 115h60m-12-8 12 8-12 8" fill="none"/></g><text x="30" y="205" font-size="18" fill="#fbbf24">Uncertain outcome: keep the mutex and investigate; no automatic retry.</text><text x="30" y="238" font-size="18" fill="#a7f3d0">Verified completion: release only the owned mutex; retain the permanent claim.</text></g></svg>