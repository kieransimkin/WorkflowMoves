<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="t d"><title id="t">Direct publication evidence flow</title><desc id="d">Hash-bound approved payloads enter a local calendar, then native queues. A closed date window retains one private draft. Public verification happens separately after release.</desc><rect width="1120" height="320" fill="#141924"/><g fill="#24344c" stroke="#85bdff" stroke-width="2"><rect x="30" y="80" width="230" height="115" rx="10"/><rect x="310" y="80" width="230" height="115" rx="10"/><rect x="590" y="80" width="230" height="115" rx="10"/><rect x="870" y="80" width="220" height="115" rx="10"/></g><g fill="#eef4ff" font-family="sans-serif" font-size="21" text-anchor="middle"><text x="145" y="119">Approved payload</text><text x="145" y="154">video · copy · cover</text><text x="425" y="119">Local calendar</text><text x="425" y="154">zone · UTC · collisions</text><text x="705" y="119">Native queue</text><text x="705" y="154">independent receipt</text><text x="980" y="119">After publication</text><text x="980" y="154">public playback · EPK</text><text x="425" y="251" font-size="18">Closed window → one private draft + dated continuation</text><text x="560" y="35" font-size="16">Generated explanatory diagram; not a platform receipt</text></g><g stroke="#85bdff" stroke-width="3"><path d="M265 137h35m245 0h35m245 0h35"/></g></svg>
