<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Make an idea behave</title><desc id="desc">Four invented visual rules: a lyric becomes a physical sign, a masked region flows into a persistent trail, lights accumulate as replies, and separate musical parts move separate objects. This is a planning illustration.</desc>
  <rect width="1200" height="740" rx="24" fill="#101c2b"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#edf4fa"><text x="44" y="60" font-size="31" font-weight="700">MAKE AN IDEA BEHAVE</text><text x="44" y="93" font-size="18" fill="#aec3d6">Subject → visual rule → cue landmark → changed state</text></g>
  <g fill="#1b2d40" stroke="#3a5268"><rect x="36" y="124" width="548" height="250" rx="16"/><rect x="608" y="124" width="556" height="250" rx="16"/><rect x="36" y="398" width="548" height="250" rx="16"/><rect x="608" y="398" width="556" height="250" rx="16"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#edf4fa" font-size="22" font-weight="600"><text x="60" y="162">WORDS BECOME MATERIALS</text><text x="632" y="162">ARTWORK BECOMES A PROCESS</text><text x="60" y="436">A MOTIF REMEMBERS</text><text x="632" y="436">A ROOM ANSWERS THE MUSIC</text></g>
  <g fill="#f3cc89" font-family="Georgia,serif" font-size="24"><text x="65" y="234">STAY</text><path d="M157 223h67m-13-9 13 9-13 9" stroke="#83cddd" stroke-width="3" fill="none"/><rect x="256" y="193" width="205" height="66" rx="7" fill="#b88850" stroke="#edc88b"/><text x="320" y="235" fill="#172433">STAY</text></g>
  <g fill="none" stroke="#83cddd" stroke-width="4"><rect x="641" y="190" width="124" height="82" rx="5"/><path d="M650 250q20-35 40-4t40-1t38-5"/><path d="M770 234c35-40 68 40 98 1s59-39 91 0 60 30 105-9"/><path d="M778 254c37-40 69 30 102-5s61-25 95 7 56 16 110-16" opacity=".45"/></g>
  <g fill="#eac58c"><rect x="74" y="477" width="57" height="69" rx="5"/><rect x="204" y="477" width="57" height="69" rx="5"/><rect x="334" y="477" width="57" height="69" rx="5"/></g><g fill="#384e66"><rect x="139" y="477" width="57" height="69" rx="5"/><rect x="269" y="477" width="57" height="69" rx="5"/><rect x="399" y="477" width="57" height="69" rx="5"/></g>
  <g fill="none" stroke="#83cddd" stroke-width="3"><path d="M649 504q15-32 30 0t30 0t30 0"/><path d="M788 524q24-10 48 0t48 0"/><path d="M945 482l17 29 17-29 17 29 17-29 17 29"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c3d5e4"><text x="60" y="304">A readable hold, then a meaningful exit.</text><text x="60" y="335">Plan carriers, glyphs, depth and line lengths.</text><text x="632" y="304">Pulse the injection. Preserve living history.</text><text x="632" y="335">Keep the reading layer clear of the feedback.</text><text x="60" y="584">Replies accumulate instead of resetting.</text><text x="60" y="615">Each recurrence carries the previous state.</text><text x="632" y="584">Bass: weight. Melody: light. Percussion: ripple.</text><text x="632" y="615">Separate roles, bounded response, shared clock.</text><text x="44" y="698" fill="#9cb4c9">Generated schematic • fictional concepts • no claim of rendered behaviour or audience results</text></g>
</svg>
