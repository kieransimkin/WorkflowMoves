<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to storyboard one song premise</title>
  <desc id="desc">Three panels follow a person towards a lit window. Three other panels keep one window and transform its light into a circular shape. This is a generated schematic using an invented premise, not audience evidence.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#17243b"/><stop offset="1" stop-color="#283b55"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffe6a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffcf75" stop-opacity="0"/></radialGradient>
    <g id="window"><rect x="-31" y="-43" width="62" height="86" rx="3" fill="#172033" stroke="#abb9cb" stroke-width="3"/><path d="M0-43V43M-31 0H31" stroke="#abb9cb" stroke-width="3"/></g>
    <g id="figure"><circle cy="-18" r="9" fill="#dce6f0"/><path d="M0-8V20M0 2L-14 14M0 2L13 12M0 20L-13 40M0 20L14 40" fill="none" stroke="#dce6f0" stroke-width="6" stroke-linecap="round"/></g>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf2f7}.muted{fill:#bbc8d8}.amber{fill:#ffda8c}.body{font-size:18px}.small{font-size:16px}.label{font-size:20px;font-weight:bold}.panel{fill:url(#night);stroke:#52657d;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="740" rx="20" fill="#0e1726"/>
  <text x="44" y="49" font-size="29" font-weight="bold">Same song premise. Different visual stories.</text>
  <text x="44" y="80" class="body muted">Invented premise: moving from isolation towards connection.</text>

  <text x="44" y="123" class="label amber">A · Lyric-led narrative</text>
  <text x="44" y="148" class="small muted">New events carry the emotional change.</text>
  <rect x="44" y="163" width="348" height="180" rx="10" class="panel"/>
  <rect x="426" y="163" width="348" height="180" rx="10" class="panel"/>
  <rect x="808" y="163" width="348" height="180" rx="10" class="panel"/>
  <path d="M45 306L391 280M427 305L773 277M809 305L1155 280" stroke="#52657d" stroke-width="3"/>
  <use href="#window" transform="translate(310 233) scale(.7)"/>
  <use href="#figure" transform="translate(115 277) scale(.7)"/>
  <path d="M151 303L283 282" stroke="#ffda8c" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="693" cy="233" r="70" fill="url(#glow)"/>
  <rect x="672" y="204" width="42" height="59" fill="#ffd989"/>
  <use href="#window" transform="translate(693 233) scale(.7)"/>
  <use href="#figure" transform="translate(601 277) scale(.7)"/>
  <circle cx="1017" cy="233" r="83" fill="url(#glow)"/>
  <rect x="989" y="192" width="56" height="82" fill="#ffd989"/>
  <use href="#window" transform="translate(1017 233)"/>
  <use href="#figure" transform="translate(965 274) scale(.7)"/>
  <use href="#figure" transform="translate(1070 274) scale(.7)"/>
  <text x="60" y="330" class="small">Situation: alone in the street</text>
  <text x="442" y="330" class="small">Development: a light answers</text>
  <text x="824" y="330" class="small">Payoff: a shared space</text>

  <text x="44" y="392" class="label amber">B · One visual hook</text>
  <text x="44" y="417" class="small muted">One impossible window develops with the music.</text>
  <rect x="44" y="432" width="348" height="180" rx="10" class="panel"/>
  <rect x="426" y="432" width="348" height="180" rx="10" class="panel"/>
  <rect x="808" y="432" width="348" height="180" rx="10" class="panel"/>
  <circle cx="218" cy="507" r="62" fill="url(#glow)"/>
  <rect x="189" y="466" width="58" height="82" fill="#ffd989"/>
  <use href="#window" transform="translate(218 507)"/>
  <circle cx="600" cy="507" r="89" fill="url(#glow)"/>
  <rect x="571" y="466" width="58" height="82" fill="#ffd989"/>
  <use href="#window" transform="translate(600 507)"/>
  <path d="M557 474Q600 445 643 474M553 540Q600 570 647 540M557 474Q541 507 553 540M643 474Q659 507 647 540" fill="none" stroke="#ffda8c" stroke-width="4"/>
  <circle cx="982" cy="507" r="92" fill="url(#glow)"/>
  <circle cx="982" cy="507" r="56" fill="#ffda8c"/>
  <path d="M982 452V562M927 507H1037" stroke="#172033" stroke-width="3"/>
  <text x="60" y="599" class="small">Promise: light escapes the frame</text>
  <text x="442" y="599" class="small">Progression: the frame bends</text>
  <text x="824" y="599" class="small">Payoff: a new shape emerges</text>

  <text x="44" y="657" class="body">Compare meaning, comprehension, musical fit and production cost.</text>
  <text x="44" y="685" class="body">Test audience capture separately; neither concept has a measured advantage.</text>
  <text x="44" y="719" class="small muted">Generated planning illustration · no real lyrics, footage, timings or performance claims</text>
</svg>
