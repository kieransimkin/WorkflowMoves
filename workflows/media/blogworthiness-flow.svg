<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="t d"><title id="t">Blogworthiness completion decisions</title><desc id="d">Verified task evidence leads to a pass or fail assessment. Fail retains a reason. Pass checks existing posts and drafts, then records publication or a precise delivery blocker.</desc><rect width="1120" height="290" rx="18" fill="#101b2b"/><g font-family="monospace" font-size="18" fill="#eff7ff"><rect x="24" y="98" width="210" height="75" rx="12" fill="#23435b"/><text x="44" y="129">Actual task</text><text x="44" y="153">evidence</text><path d="M234 136H288M505 136H560M785 136H842" stroke="#90d4e0" stroke-width="3"/><rect x="288" y="98" width="217" height="75" rx="12" fill="#23435b"/><text x="309" y="129">Reader-interest</text><text x="309" y="153">assessment</text><rect x="560" y="98" width="225" height="75" rx="12" fill="#23594d"/><text x="579" y="129">PASS: compare</text><text x="579" y="153">posts + drafts</text><rect x="842" y="62" width="250" height="148" rx="12" fill="#23435b"/><text x="860" y="94">Retain next action</text><text x="860" y="124">Publicly verified</text><text x="860" y="151">or exact blocker</text><text x="860" y="182">with continuation</text><path d="M396 173V222H649" stroke="#90d4e0" stroke-width="3" fill="none"/><text x="440" y="249">FAIL: retain evidence and reason</text><text x="25" y="37" fill="#90d4e0">Illustration of required decisions; not execution evidence</text></g></svg>
