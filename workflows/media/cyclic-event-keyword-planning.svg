<title id="t">Recurring-event keyword planning contract</title><desc id="d">Song intent and verified event dates feed matched completed cycles. Event-relative windows and honest holdouts become platform-specific future schedule candidates, then independent native receipts. No data or forecast is depicted.</desc>
<rect width="1200" height="430" rx="18" fill="#102436"/>
<g font-family="sans-serif" fill="#f3f7fb"><text x="30" y="40" font-size="24">A recurring date is an anchor, not a promise of listeners</text><text x="30" y="74" font-size="16" fill="#c1d4e5">Generated contract illustration — no measured series, forecast or native save is shown</text></g>
<g fill="#203d53" stroke="#8bbbd2" stroke-width="2"><rect x="30" y="110" width="340" height="105" rx="12"/><rect x="430" y="110" width="340" height="105" rx="12"/><rect x="830" y="110" width="340" height="105" rx="12"/><rect x="30" y="280" width="340" height="105" rx="12"/><rect x="430" y="280" width="340" height="105" rx="12"/><rect x="830" y="280" width="340" height="105" rx="12"/></g>
<g font-family="sans-serif" fill="#f3f7fb" font-size="14"><text x="48" y="142">1. Song and listener intent</text><text x="48" y="176" font-size="12">Music intent differs from event context</text><text x="448" y="142">2. Verified event + matched scope</text><text x="448" y="176" font-size="12">Each edition; same scope and precision</text><text x="848" y="142">3. Completed cycles + clear scales</text><text x="848" y="176" font-size="12">Zeros, missing and partial differ</text><text x="48" y="313">4. Align and test a window</text><text x="48" y="347" font-size="12">Spread, holdouts and honest limits</text><text x="448" y="313">5. Platform-specific candidate slot</text><text x="448" y="347" font-size="12">Readiness, audience, clashes, UTC</text><text x="848" y="313">6. One save + native readback</text><text x="848" y="347" font-size="12">Accepted slot; public result later</text></g>
