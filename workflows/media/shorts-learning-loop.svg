<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="310" viewBox="0 0 1280 310" role="img" aria-labelledby="title desc"><title id="title">Opening test and learning loop</title><desc id="desc">Illustrated process: write a single opening hypothesis, verify the actual published pair, collect native metrics at comparable ages, then decide and retain a source-backed report edition.</desc><rect width="1280" height="310" fill="#eef4f8"/><g font-family="Arial,sans-serif" fill="#16374d"><text x="32" y="40" font-size="25" font-weight="bold">One opening question, separate platform evidence</text><g stroke="#839faf" stroke-width="2" fill="#fff"><rect x="30" y="75" width="270" height="160" rx="12"/><rect x="345" y="75" width="270" height="160" rx="12"/><rect x="660" y="75" width="270" height="160" rx="12"/><rect x="975" y="75" width="270" height="160" rx="12"/></g><g font-size="20" font-weight="bold"><text x="48" y="110">1. Specify the opening</text><text x="363" y="110">2. Verify publication</text><text x="678" y="110">3. Read native results</text><text x="993" y="110">4. Decide and retain</text></g><g font-size="17"><text x="48" y="146">Control / treatment</text><text x="48" y="176">One variable · same audio</text><text x="48" y="206">Frame zero → two seconds</text><text x="363" y="146">Exact account, ID and hash</text><text x="363" y="176">Actual live time and state</text><text x="363" y="206">A plan is not exposure</text><text x="678" y="146">Counts, scope and cutoff</text><text x="678" y="176">Comparable post ages</text><text x="678" y="206">Unknown is not zero</text><text x="993" y="146">Continue / adjust / stop</text><text x="993" y="176">Or inconclusive with reason</text><text x="993" y="206">Immutable evidence/edition</text></g><g font-size="30"><text x="309" y="163">→</text><text x="624" y="163">→</text><text x="939" y="163">→</text></g><text x="32" y="280" font-size="17">Generated explanatory diagram. No audience result, publication, causation or completed test is depicted.</text></g></svg>
