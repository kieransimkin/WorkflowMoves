<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Audit EPK timing authority</title>
  <desc id="description">Approved source leads to Saved WordPress fields leads to Signed-out runtime. Retain a separate disposition for each field.</desc>
  <rect width="960" height="260" rx="20" fill="#101828"/>
  <text x="32" y="48" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="27" font-weight="700">Audit EPK timing authority</text>
  <g font-family="system-ui, sans-serif">
    <rect x="32" y="82" width="276" height="91" rx="12" fill="#1d2939" stroke="#5b91cf" stroke-width="2"/>
    <text x="48" y="116" fill="#f9fafb" font-size="19" font-weight="700">Approved source</text>
    <text x="48" y="145" fill="#d0d5dd" font-size="16">Recording, tempo and digests</text>
    <rect x="342" y="82" width="276" height="91" rx="12" fill="#1d2939" stroke="#5b91cf" stroke-width="2"/>
    <text x="358" y="116" fill="#f9fafb" font-size="19" font-weight="700">Saved WordPress fields</text>
    <text x="358" y="145" fill="#d0d5dd" font-size="16">BPM and attachment IDs</text>
    <rect x="652" y="82" width="276" height="91" rx="12" fill="#1d2939" stroke="#5b91cf" stroke-width="2"/>
    <text x="668" y="116" fill="#f9fafb" font-size="19" font-weight="700">Signed-out runtime</text>
    <text x="668" y="145" fill="#d0d5dd" font-size="16">Player, hosted bytes and clock</text>
    <path d="M 313,127 h 22 l -7,-6 m 7,6 l -7,6 M 623,127 h 22 l -7,-6 m 7,6 l -7,6" fill="none" stroke="#84caff" stroke-width="2"/>
    <text x="32" y="218" fill="#d0d5dd" font-size="17">Retain a separate disposition for each field.</text>
  </g>
</svg>
