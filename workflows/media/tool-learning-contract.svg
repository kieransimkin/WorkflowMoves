<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">From development evidence to verified shared workflows</title>
<desc id="desc">User intent and observed failure are checked against current source. A lesson goes to its canonical owner, then through regression and consumer evidence into a maintained workflow. Missing history and unqualified hosts remain explicit limits.</desc>
<rect width="1200" height="420" rx="24" fill="#10232b"/>
<g font-family="ui-sans-serif, sans-serif" fill="#f5faf7">
<text x="42" y="55" font-size="28" font-weight="700">A lesson needs an evidence trail</text>
<text x="42" y="88" font-size="17" fill="#b5d4d1">Generated contract illustration · not a completed-run receipt</text>
<g stroke="#61d9c5" stroke-width="2" fill="#1e3942">
<rect x="42" y="131" width="245" height="146" rx="14"/><rect x="332" y="131" width="245" height="146" rx="14"/><rect x="622" y="131" width="245" height="146" rx="14"/><rect x="912" y="131" width="245" height="146" rx="14"/>
</g>
<g stroke="#61d9c5" stroke-width="3"><path d="M290 204h34m-10-8 10 8-10 8M580 204h34m-10-8 10 8-10 8M870 204h34m-10-8 10 8-10 8" fill="none"/></g>
<g font-size="19" font-weight="700"><text x="62" y="168">Recover intent</text><text x="352" y="168">Verify source</text><text x="642" y="168">Change the owner</text><text x="932" y="168">Test the contract</text></g>
<g font-size="16" fill="#d5e7e3"><text x="62" y="207">Requirement + failure</text><text x="62" y="235">Readable history + limits</text><text x="352" y="207">Exact revision + runtime</text><text x="352" y="235">Reproduce the invariant</text><text x="642" y="207">Tool, guide or adapter</text><text x="642" y="235">Preserve other owners</text><text x="932" y="207">Regression + consumer</text><text x="932" y="235">Retain the actual result</text></g>
<text x="42" y="330" font-size="19" fill="#ffd39e">Seventeen component workflows + one separate discovery toolkit</text>
<text x="42" y="365" font-size="16" fill="#b5d4d1">Documentation coverage, source tests, native-host acceptance and public verification remain distinct.</text>
</g></svg>
