name: Release workflows
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Build exact source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          git archive --format=zip --prefix=my-songs-workflows/ -o "release/my-songs-workflows-${RELEASE_TAG}.zip" HEAD
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --title "My Songs workflows ${{ github.ref_name }}" --notes "Additive workflow rules and guarded installation, with a read-only EPK evidence gate for every painted phone consumer, neutral lifecycle resets, exact metadata timing sources, parser and source-switch evidence, track association and responsive observations. Partial sensor attachments fail; synthetic evidence does not certify physical delivery or frame rate. Existing timing preflight, publicity inventory and fresh pictorial blog artwork rules are preserved. Verified publicity-only EPK additions have standing publication approval in every song campaign and EPK audit job, subject to original evidence, fresh-source preservation and public verification. Unrelated public deployment retains its approval gates. The archive is the exact tested source revision; private music and evidence are excluded."
